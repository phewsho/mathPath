<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Path Defend</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8621231846514744" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg0:#090b14;--bg1:#0f1120;--bg2:#141828;--bg3:#1a1e32;
  --border:#1e2240;--border2:#2a3060;
  --acc:#e94560;--acc2:#facc15;--acc3:#34d399;--acc4:#a78bfa;
  --txt:#f0f0f0;--txt2:#999;--txt3:#555;
  --num-clr:#e8eeff;--num-bg:#12141f;--num-bdr:#2a2d45;
  --op-plus-clr:#ff4d8f;--op-plus-bg:#120008;--op-plus-bdr:#ff4d8f;
  --op-minus-clr:#00e5c0;--op-minus-bg:#001a14;--op-minus-bdr:#00e5c0;
  --op-mul-clr:#b06fff;--op-mul-bg:#0d0820;--op-mul-bdr:#b06fff;
  --op-div-clr:#38cfff;--op-div-bg:#001828;--op-div-bdr:#38cfff;
  --wall-bg:#111;--wall-clr:#2a2a2a;--wall-bdr:#1e1e1e;
  --go-bg1:rgba(10,10,10,.97);--go-bg2:rgba(30,4,10,.97);
  --tube:#e94560;
}
body.light{
  --bg0:#f5f0ff;--bg1:#ede8f8;--bg2:#e4ddf5;--bg3:#d8d0ee;
  --border:#c8beec;--border2:#b0a4e0;
  --acc:#e94560;--acc2:#d97706;--acc3:#059669;--acc4:#7c3aed;
  --txt:#1a1a2e;--txt2:#4a4468;--txt3:#8878b8;
  --num-clr:#1a1a2e;--num-bg:#ddd5f8;--num-bdr:#b0a4e0;
  --op-plus-clr:#be185d;--op-plus-bg:#fce7f3;--op-plus-bdr:#f9a8d4;
  --op-minus-clr:#065f46;--op-minus-bg:#d1fae5;--op-minus-bdr:#6ee7b7;
  --op-mul-clr:#1e40af;--op-mul-bg:#dbeafe;--op-mul-bdr:#93c5fd;
  --op-div-clr:#854d0e;--op-div-bg:#fefce8;--op-div-bdr:#fde68a;
  --wall-bg:#c8c0e8;--wall-clr:#9888c8;--wall-bdr:#b0a4d8;
  --go-bg1:rgba(245,240,255,.97);--go-bg2:rgba(235,220,250,.97);
  --tube:#e94560;
}

html,body{width:100%;min-height:100%;background:var(--bg0);color:var(--txt);font-family:'Space Mono',monospace;}
body{display:flex;align-items:flex-start;justify-content:center;padding:16px 12px 40px;}
#app{width:100%;max-width:540px;position:relative;}

/* HEADER */
#header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;}
#title{font-family:'Orbitron',sans-serif;font-size:20px;font-weight:900;color:var(--acc);letter-spacing:2px;line-height:1.2;flex-shrink:0;}
#title span{display:block;font-size:11px;color:var(--txt2);letter-spacing:4px;font-weight:400;}
#header-right{display:flex;align-items:center;gap:6px;}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;text-align:center;min-width:56px;}
.stat-label{font-size:10px;color:var(--txt3);letter-spacing:2px;text-transform:uppercase;margin-bottom:2px;}
.stat-val{font-family:'Orbitron',sans-serif;font-size:22px;font-weight:700;font-weight:700;color:var(--txt);}
.stat-val.gold{color:var(--acc2);}.stat-val.danger{color:var(--acc);}

/* THEME BTN */
#btn-theme{background:var(--bg2);border:1px solid var(--border);color:var(--txt2);border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer;transition:all .15s;white-space:nowrap;}
#btn-theme:hover{border-color:var(--border2);color:var(--txt);}

/* DIFFICULTY BAR */
#diff-bar{display:flex;gap:4px;margin-bottom:10px;}
.diff-btn{flex:1;padding:9px 2px;font-size:14px;font-weight:700;font-family:'Space Mono',monospace;letter-spacing:.5px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);color:var(--txt3);cursor:pointer;transition:all .15s;text-align:center;}
.diff-btn:hover{border-color:var(--border2);color:var(--txt2);}
.diff-btn.active{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;}
.diff-btn[data-d="zen"].active{background:#34d399;border-color:#34d399;color:#000;}
.diff-btn[data-d="easy"].active{background:#60a5fa;border-color:#60a5fa;color:#000;}
.diff-btn[data-d="mid"].active{background:#facc15;border-color:#facc15;color:#000;}
.diff-btn[data-d="hard"].active{background:#fb923c;border-color:#fb923c;color:#000;}
.diff-btn[data-d="god"].active{background:#f87171;border-color:#f87171;color:#fff;}

/* VOL ROW */
#vol-row{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:7px 12px;margin-bottom:8px;}
#vol-icon{font-size:16px;cursor:pointer;user-select:none;flex-shrink:0;}
#vol-slider{width:120px;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--bg3);outline:none;cursor:pointer;}
#vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--acc4);cursor:pointer;border:2px solid var(--bg2);}
#vol-pct{font-size:11px;color:var(--txt3);font-family:'Orbitron',sans-serif;min-width:32px;text-align:right;}

/* SETTINGS ROW */
#settings-row{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
#settings-label{font-size:11px;color:var(--txt3);letter-spacing:2px;white-space:nowrap;}
#timer-slider{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--bg3);outline:none;cursor:pointer;}
#timer-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--acc3);cursor:pointer;border:2px solid var(--bg2);}
#timer-slider:disabled{opacity:.25;}
#timer-input-wrap{display:flex;align-items:center;gap:3px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;padding:4px 10px;}
#timer-num-input{background:transparent;border:none;outline:none;color:var(--acc2);font-family:'Orbitron',sans-serif;font-size:17px;font-weight:700;width:46px;text-align:right;}
#timer-num-input::-webkit-inner-spin-button{-webkit-appearance:none;}
#timer-num-input:disabled{color:var(--txt3);}
#timer-unit{font-size:11px;color:var(--txt3);}
#inf-toggle{background:transparent;border:1px solid var(--border);color:var(--txt3);border-radius:5px;padding:4px 10px;font-size:14px;cursor:pointer;transition:all .12s;}
#inf-toggle.on{border-color:var(--acc4);color:var(--acc4);}
#inf-toggle:disabled{opacity:.25;cursor:not-allowed;}
.preset-btn{background:transparent;border:1px solid var(--border);color:var(--txt3);border-radius:5px;padding:4px 8px;font-family:'Space Mono',monospace;font-size:11px;cursor:pointer;white-space:nowrap;transition:all .12s;}
.preset-btn:hover{border-color:var(--acc3);color:var(--acc3);}
.preset-btn:disabled{opacity:.25;cursor:not-allowed;}
#timer-locked-msg{font-size:10px;color:var(--txt3);letter-spacing:.5px;white-space:nowrap;}

/* TARGET BAR */
#target-bar{background:var(--bg2);border:1px solid var(--border2);border-radius:10px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden;}
#target-bar::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc);}
#target-left{display:flex;align-items:baseline;gap:10px;}
#target-tag{font-size:15px;font-weight:700;color:var(--txt3);letter-spacing:3px;}
#target-num{font-family:'Orbitron',sans-serif;font-size:52px;font-weight:900;color:var(--acc2);line-height:1;}
#target-hint{font-size:11px;color:var(--txt3);text-align:right;line-height:1.9;}

/* TIMER */
#timer-wrapper{margin-bottom:8px;}
#timer-bar-bg{height:7px;background:var(--bg3);border-radius:4px;overflow:hidden;}
#timer-bar{height:100%;border-radius:4px;background:var(--acc3);transition:background .5s;width:100%;}
#timer-row{display:flex;justify-content:space-between;align-items:center;margin-top:4px;}
#timer-label{font-size:13px;font-weight:600;color:var(--txt3);}
#timer-secs{font-size:14px;font-weight:700;color:var(--txt2);font-family:'Orbitron',sans-serif;}

/* EXPRESSION */
#expr-bar{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;min-height:40px;}
#expr-text{font-size:19px;font-weight:700;color:var(--acc3);letter-spacing:1px;flex:1;}
#expr-result{font-family:'Orbitron',sans-serif;font-size:27px;font-weight:900;color:var(--txt3);min-width:50px;text-align:right;transition:color .15s;}

/* MESSAGE */
#message{text-align:center;font-size:17px;font-weight:700;letter-spacing:2px;min-height:18px;margin-bottom:6px;color:var(--acc3);font-weight:700;}

/* GRID WRAPPER */
#main-area{display:flex;gap:10px;align-items:flex-start;}
#grid-container{flex:1;position:relative;}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;position:relative;}

/* TUBE SVG OVERLAY */
#tube-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none!important;z-index:5;overflow:visible;}

/* TILES */
.tile{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:16px;border:2px solid transparent;
  font-size:30px;font-weight:900;font-family:'Orbitron',sans-serif;
  cursor:pointer;transition:transform .08s cubic-bezier(.34,1.56,.64,1),box-shadow .1s,filter .1s;
  position:relative;user-select:none;-webkit-user-select:none;overflow:hidden;
}
.tile.num{color:var(--num-clr);background:var(--num-bg);border-color:var(--num-bdr);box-shadow:0 0 6px rgba(100,120,255,0.15);}
.tile.op{border-radius:50%;font-size:21px;}
.tile.op[data-v="+"]{color:var(--op-plus-clr);background:var(--op-plus-bg);border-color:var(--op-plus-bdr);box-shadow:0 0 10px rgba(255,77,143,0.4),inset 0 0 8px rgba(255,77,143,0.08);}
.tile.op[data-v="-"]{color:var(--op-minus-clr);background:var(--op-minus-bg);border-color:var(--op-minus-bdr);box-shadow:0 0 10px rgba(0,229,192,0.4),inset 0 0 8px rgba(0,229,192,0.08);}
.tile.op[data-v="×"]{color:var(--op-mul-clr);background:var(--op-mul-bg);border-color:var(--op-mul-bdr);box-shadow:0 0 10px rgba(176,111,255,0.4),inset 0 0 8px rgba(176,111,255,0.08);}
.tile.op[data-v="÷"]{color:var(--op-div-clr);background:var(--op-div-bg);border-color:var(--op-div-bdr);box-shadow:0 0 10px rgba(56,207,255,0.4),inset 0 0 8px rgba(56,207,255,0.08);}
.tile.wall{background:var(--wall-bg);color:var(--wall-clr);cursor:default;border-color:var(--wall-bdr);border-radius:8px;font-size:16px;}
.tile.wall::after{content:'✦';opacity:.3;}
.tile.num:hover:not(.wrong):not(.clear){transform:scale(1.09) translateY(-3px);filter:brightness(1.15);}
.tile.op:hover:not(.wrong):not(.clear){transform:scale(1.12) rotate(20deg);filter:brightness(1.15);}
.tile.selected{transform:scale(1.11) translateY(-3px)!important;box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.15);filter:brightness(1.25) saturate(1.2);z-index:6;}

@keyframes squish-pop{
  0%{transform:scale(1);opacity:1;}12%{transform:scale(1.3,.7);opacity:1;}
  30%{transform:scale(.8,1.2);opacity:1;}50%{transform:scale(1.15,.9);opacity:1;}
  70%{transform:scale(.9,1.05);opacity:.7;}100%{transform:scale(.05);opacity:0;}
}
@keyframes bounce-in{
  0%{transform:scale(0) translateY(14px);opacity:0;}
  55%{transform:scale(1.18) translateY(-5px);opacity:1;}
  75%{transform:scale(.9) translateY(2px);}100%{transform:scale(1) translateY(0);opacity:1;}
}
@keyframes wrong-shake{
  0%,100%{transform:translateX(0) rotate(0);}15%{transform:translateX(-7px) rotate(-4deg);}
  35%{transform:translateX(7px) rotate(4deg);}55%{transform:translateX(-4px) rotate(-2deg);}
  75%{transform:translateX(4px) rotate(2deg);}
}
@keyframes pulse-enemy{0%,100%{box-shadow:0 0 6px var(--acc);}50%{box-shadow:0 0 14px var(--acc);}}
@keyframes hint-glow{
  0%,100%{box-shadow:0 0 0 2px var(--acc4);filter:brightness(1.1);}
  50%{box-shadow:0 0 12px 4px var(--acc4);filter:brightness(1.5);}
}
@keyframes auto-reset-flash{0%,100%{opacity:1;}50%{opacity:.2;}}

.tile.wrong{animation:wrong-shake .42s cubic-bezier(.36,.07,.19,.97);border-color:var(--acc)!important;}
.tile.clear{animation:squish-pop .42s cubic-bezier(.36,.07,.19,.97) forwards;pointer-events:none;}
.tile.new{animation:bounce-in .38s cubic-bezier(.34,1.56,.64,1);}
.tile.enemy{animation:pulse-enemy 1.2s infinite;}
.tile.hint{animation:hint-glow .65s ease-in-out 5;border-color:var(--acc4)!important;}
.tile.auto-reset{animation:auto-reset-flash .3s ease-in-out 3;}

/* SIDEBAR */
#sidebar{display:flex;flex-direction:column;gap:6px;width:90px;}
.side-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 6px;text-align:center;}
.side-card .sc-label{font-size:13px;font-weight:700;color:var(--txt3);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
.side-card .sc-val{font-family:'Orbitron',sans-serif;font-size:24px;font-weight:700;font-weight:700;color:var(--acc2);}
#wave-card{flex:1;display:flex;flex-direction:column;}
#wave-track{flex:1;background:var(--bg3);border-radius:4px;overflow:hidden;display:flex;flex-direction:column-reverse;min-height:70px;}
#wave-fill{background:var(--acc3);border-radius:4px;transition:height .15s linear,background .5s;width:100%;}
.side-btn{background:transparent;border:1px solid var(--border2);color:var(--txt2);border-radius:7px;padding:7px 4px;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:all .15s;width:100%;}
.side-btn:hover{border-color:var(--acc);color:var(--acc);}
.side-btn:disabled{opacity:.3;cursor:not-allowed;}
#btn-pause.paused{border-color:var(--acc2);color:var(--acc2);}
#hint-count{background:var(--acc4);color:#fff;border-radius:10px;font-size:9px;padding:1px 6px;font-weight:700;}
#btn-clear-manual.penalty{border-color:#f87171;color:#f87171;animation:wrong-shake .4s;}
#btn-hint{display:flex;align-items:center;justify-content:center;gap:5px;}
#hint-info{font-size:13px;font-weight:700;color:var(--txt3);text-align:center;margin-top:2px;}
#bottom-hint{font-size:14px;font-weight:600;color:var(--txt3);text-align:center;margin-top:8px;margin-bottom:16px;letter-spacing:.5px;line-height:1.6;}
#penalty-badge{font-size:14px;font-weight:700;color:#f87171;text-align:center;min-height:15px;margin-top:2px;letter-spacing:1px;}
#pause-overlay{display:none;position:fixed;inset:0;background:rgba(4,5,12,.96);flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:50;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
#pause-overlay.show{display:flex;}
#pause-title{font-family:'Orbitron',sans-serif;font-size:30px;font-weight:900;color:var(--acc2);letter-spacing:6px;}
#pause-sub{font-size:10px;color:var(--txt3);letter-spacing:3px;}
#btn-resume{background:var(--acc2);color:#000;border:none;border-radius:8px;padding:12px 28px;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;font-weight:700;cursor:pointer;letter-spacing:3px;}

/* GAME OVER */
#gameover{display:none;position:fixed;inset:0;background:linear-gradient(160deg,var(--go-bg1) 0%,var(--go-bg2) 100%);flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:100;}
#gameover.show{display:flex;}
#go-title{font-family:'Orbitron',sans-serif;font-size:34px;font-weight:900;color:var(--acc);letter-spacing:6px;}
#go-sub{font-size:10px;color:var(--txt3);letter-spacing:3px;}
.go-stat{display:flex;flex-direction:column;align-items:center;gap:4px;}
.go-stat .gl{font-size:9px;color:var(--txt3);letter-spacing:2px;}
.go-stat .gv{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:700;color:var(--acc2);}
.go-row{display:flex;gap:28px;}
#btn-restart{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:11px 28px;font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;font-weight:700;cursor:pointer;letter-spacing:3px;transition:opacity .15s,transform .1s;margin-top:4px;}
#btn-restart:hover{opacity:.88;transform:scale(1.03);}

/* LEADERBOARD */
#lb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:center;justify-content:center;}
#lb-overlay.show{display:flex;}
#lb-panel{background:var(--bg1);border:1px solid var(--border2);border-radius:16px;padding:24px;width:340px;max-height:80vh;display:flex;flex-direction:column;gap:14px;}
#lb-title{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:900;color:var(--acc);letter-spacing:3px;text-align:center;}
#lb-tabs{display:flex;gap:4px;}
.lb-tab{flex:1;padding:5px 2px;font-size:9px;font-family:'Space Mono',monospace;border-radius:5px;border:1px solid var(--border);background:var(--bg2);color:var(--txt3);cursor:pointer;text-align:center;transition:all .12s;}
.lb-tab.active{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;}
#lb-list{flex:1;overflow-y:auto;}
.lb-entry{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--border);}
.lb-rank{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;width:24px;color:var(--txt3);}
.lb-rank.gold{color:#facc15;}.lb-rank.silver{color:#94a3b8;}.lb-rank.bronze{color:#fb923c;}
.lb-name{flex:1;font-size:11px;color:var(--txt);}
.lb-score{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;color:var(--acc2);}
.lb-wave{font-size:9px;color:var(--txt3);min-width:32px;text-align:right;}
.lb-empty{text-align:center;color:var(--txt3);font-size:11px;padding:24px;}
#btn-lb-close{background:var(--bg2);border:1px solid var(--border);color:var(--txt2);border-radius:8px;padding:8px;font-family:'Space Mono',monospace;font-size:10px;cursor:pointer;text-align:center;transition:all .12s;}
#btn-lb-close:hover{border-color:var(--acc);color:var(--acc);}

/* NAME INPUT MODAL */
#name-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;align-items:center;justify-content:center;}
#name-modal.show{display:flex;}
#name-panel{background:var(--bg1);border:1px solid var(--border2);border-radius:14px;padding:28px 24px;width:300px;display:flex;flex-direction:column;gap:14px;align-items:center;}
#name-panel h3{font-family:'Orbitron',sans-serif;font-size:14px;color:var(--acc);letter-spacing:2px;text-align:center;}
#name-panel p{font-size:10px;color:var(--txt3);text-align:center;letter-spacing:1px;}
#name-input{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:10px 14px;color:var(--txt);font-family:'Space Mono',monospace;font-size:14px;width:100%;outline:none;text-align:center;}
#name-input:focus{border-color:var(--acc);}
#btn-name-confirm{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:10px 24px;font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:2px;width:100%;}

/* LB BUTTON */
#btn-lb{background:transparent;border:1px solid var(--border2);color:var(--txt2);border-radius:6px;padding:4px 10px;font-family:'Space Mono',monospace;font-size:10px;cursor:pointer;transition:all .12s;}
#btn-lb:hover{border-color:var(--acc4);color:var(--acc4);}

/* PENALTY BADGE */
#penalty-badge{font-size:10px;color:#f87171;text-align:center;min-height:14px;margin-top:2px;letter-spacing:1px;}
</style>
</head>
<body>
<div style="width:100%;max-width:540px;margin:8px auto;text-align:center;">
  <ins class="adsbygoogle"
       style="display:block;width:100%;height:90px;"
       data-ad-client="ca-pub-8621231846514744"
       data-ad-slot="auto"
       data-ad-format="horizontal"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</div>
<div id="app">

  <!-- HEADER -->
  <div id="header">
    <div id="title">MATH PATH<span>DEFEND</span></div>
    <div id="header-right">

<script>
// ═══════════════════════════════════════════════
// DIFFICULTY CONFIG
// ═══════════════════════════════════════════════
const DIFF = {

  easy: { label:'🌱 초보', ops:['+','-'],          minT:4,  maxT:10, timer:60,  hp:5,   hintN:3,        wallPerWave:0, waveDecay:600,  penaltyPct:0.1 },
  mid:  { label:'⚔️ 중수', ops:['+','-','×'],      minT:8,  maxT:24, timer:120, hp:5,   hintN:2,        wallPerWave:1, waveDecay:700,  penaltyPct:0.15},
  hard: { label:'🔥 고수', ops:['+','-','×','÷'],  minT:12, maxT:40, timer:60,  hp:4,   hintN:1,        wallPerWave:2, waveDecay:800,  penaltyPct:0.2 },
  god:  { label:'💀 신',   ops:['+','-','×','÷'],  minT:20, maxT:60, timer:30,  hp:3,   hintN:0,        wallPerWave:3, waveDecay:900,  penaltyPct:0.3 },
};

const GRID = 5;

let grid=[],selected=[],isDragging=false;
let score=0,hp=5,wave=1,combo=1,best=0;
let target=0,gameActive=true,isPaused=false,pauseElapsed=0;
let BASE_DUR=30000,INFINITE_TIMER=false,hintLeft=3,hintPath=null;
let timerStart=0,timerDur=30000,rafId=null;
let currentDiff='easy';
let msgTimeout=null,penaltyTimeout=null;

// ═══════════════════════════════════════════════
// LEADERBOARD — Google Sheets 연동
// ═══════════════════════════════════════════════
const GS_URL='https://script.google.com/macros/s/AKfycbwe09sDhBKacsnDSiYXN7tri5OEufYWR5wnBQkEk_8LBQbwUuYIJu5f4EpWNvGKT1J4/exec';

// 점수 등록 (POST)
async function addToLB(diff,name,sc,wv){
  const url=`${GS_URL}?action=post&diff=${encodeURIComponent(diff)}&name=${encodeURIComponent(name)}&score=${sc}&wave=${wv}`;
  try{ await fetch(url,{method:'GET',mode:'no-cors'}); }

// 순위 조회 (GET)
async function fetchLB(diff){

// ═══════════════════════════════════════════════
// SOUND ENGINE — 샤랄라 버전
// ═══════════════════════════════════════════════
const AC=new(window.AudioContext||window.webkitAudioContext)();
const masterGain=AC.createGain(); masterGain.gain.value=0.6; masterGain.connect(AC.destination);

// Reverb convolver for sparkle tail
let reverb=null;
(function buildReverb(){
  const len=AC.sampleRate*1.2, buf=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  }
  reverb=AC.createConvolver(); reverb.buffer=buf;
  const rvGain=AC.createGain(); rvGain.gain.value=0.18;
  reverb.connect(rvGain); rvGain.connect(masterGain);
})();

let isMuted=false,volBeforeMute=0.6;
function resumeAC(){if(AC.state==='suspended')AC.resume();}
document.addEventListener('mousedown',resumeAC);
document.addEventListener('touchstart',resumeAC);

// Core tone: pure sine + optional reverb send
function playTone({freq=880,type='sine',vol=0.13,attack=0.003,decay=0.05,sustain=0.35,release=0.2,duration=0.22,detune=0,rv=true}={}){
  const now=AC.currentTime;
  const osc=AC.createOscillator(),gain=AC.createGain();
  osc.type=type;
  osc.frequency.setValueAtTime(freq,now);
  if(detune) osc.detune.setValueAtTime(detune,now);
  gain.gain.setValueAtTime(0,now);
  gain.gain.linearRampToValueAtTime(vol,now+attack);
  gain.gain.linearRampToValueAtTime(vol*sustain,now+attack+decay);
  gain.gain.setValueAtTime(vol*sustain,now+duration-release);
  gain.gain.exponentialRampToValueAtTime(0.0001,now+duration);
  osc.connect(gain);
  gain.connect(masterGain);
  if(rv&&reverb) gain.connect(reverb);
  osc.start(now); osc.stop(now+duration+0.05);
}

// Crystal bell: fundamental + 2nd harmonic + shimmer detune
function bell(freq,vol=0.10,delay=0,rv=true){
  setTimeout(()=>{
    playTone({freq,type:'sine',vol,attack:.002,decay:.04,sustain:.25,release:.28,duration:.32,rv});
    playTone({freq:freq*2.756,type:'sine',vol:vol*.28,attack:.003,decay:.03,sustain:.1,release:.22,duration:.25,rv:false});
    playTone({freq,type:'sine',vol:vol*.18,attack:.003,decay:.03,sustain:.15,release:.2,duration:.2,detune:6,rv:false});
  },delay);
}

// Fairy dust: rapid high sparkle
function sparkle(baseFreq,vol=0.07,delay=0){
  setTimeout(()=>{
    [0,30,55,80].forEach((d,i)=>{
      setTimeout(()=>playTone({freq:baseFreq*(1+i*.08),type:'sine',vol:vol*(1-i*.2),attack:.001,decay:.02,sustain:.05,release:.1,duration:.12,rv:false}),d);
    });
  },delay);
}

// ─── GAME SOUNDS — 샤랄라 MAX ────────────────────
// 픽: 유리구슬 튕기는 소리
function soundPick(){
  bell(2093,.08);
  sparkle(3136,.06,15);
  bell(1568,.05,40);
}

// 연결: 음계 상승 + 짧은 스파클
const CONNECT_SCALE=[880,1047,1175,1319,1480,1568,1760,2093];
function soundConnect(){
  const f=CONNECT_SCALE[Math.min(selected.length-1,CONNECT_SCALE.length-1)];
  bell(f,.09);
  sparkle(f*2,.04,30);
}

// 성공: 마법 하프 + 별빛 폭발
function soundSuccess(comboN){
  const boost=1+(comboN-1)*.025;
  // 하프 아르페지오
  [659,784,988,1175,1480,1760].forEach((f,i)=>{
    bell(f*boost,.13,i*45,true);
  });
  // 별빛 스파클 3연타
  [280,420,560].forEach((d,i)=>sparkle(2093*boost*(1+i*.1),.10,d));
  // 코다: 극고음 잔향
  setTimeout(()=>{
    bell(3136*boost,.08,0,true);
    bell(3520*boost,.06,60,true);
    sparkle(4186*boost,.07,120);
  },500);
}

// 실패: 뽁 (귀엽게)
function soundFail(){
  playTone({freq:440,type:'sine',vol:.08,attack:.002,decay:.05,sustain:.05,release:.12,duration:.2,rv:false});
  setTimeout(()=>playTone({freq:330,type:'sine',vol:.06,attack:.002,decay:.04,sustain:.02,release:.1,duration:.16,rv:false}),80);
  setTimeout(()=>playTone({freq:262,type:'triangle',vol:.04,attack:.002,decay:.03,sustain:.01,release:.08,duration:.12,rv:false}),150);
}

// 웨이브: 경고 차임 (내려가는 크리스탈)
function soundWave(){
  [1760,1480,1175,988,784].forEach((f,i)=>bell(f,.09,i*70,i<3));
}

// 패널티: 뭉툭한 노크
function soundPenalty(){
  playTone({freq:220,type:'triangle',vol:.11,attack:.004,decay:.08,sustain:.05,release:.15,duration:.28,rv:false});
  setTimeout(()=>playTone({freq:185,type:'triangle',vol:.07,attack:.003,decay:.06,sustain:.02,release:.1,duration:.2,rv:false}),100);
}

// 자동초기화: 바람 차임
function soundAutoReset(){
  [2093,1760,1480,1319,1175].forEach((f,i)=>bell(f,.07,i*60,true));
  sparkle(2637,.06,80);
}

// Volume UI
const volSlider=document.getElementById('vol-slider');
const volPct=document.getElementById('vol-pct');
const volIcon=document.getElementById('vol-icon');
volSlider.addEventListener('input',()=>{
  const v=parseInt(volSlider.value)/100;
  masterGain.gain.value=v; isMuted=v===0;
  volPct.textContent=volSlider.value+'%';
  volIcon.textContent=v===0?'🔇':v<.4?'🔉':'🔊';
});
volIcon.addEventListener('click',()=>{
  if(!isMuted){volBeforeMute=masterGain.gain.value;masterGain.gain.value=0;volSlider.value=0;volPct.textContent='0%';volIcon.textContent='🔇';isMuted=true;}
  else{const v=volBeforeMute||.6;masterGain.gain.value=v;volSlider.value=Math.round(v*100);volPct.textContent=Math.round(v*100)+'%';volIcon.textContent=v<.4?'🔉':'🔊';isMuted=false;}
});

// ═══════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function cfg(){return DIFF[currentDiff];}

function genTarget(){
  const c=cfg();
  return rnd(c.minT,c.maxT);
}

function genTile(r,c,forceType){
  if(forceType==='wall') return{type:'wall',val:'',row:r,col:c,id:Math.random()};
  const isOp=(r+c)%2===1;
  if(isOp) return{type:'op',val:cfg().ops[rnd(0,cfg().ops.length-1)],row:r,col:c,id:Math.random()};
  return{type:'num',val:rnd(1,9),row:r,col:c,id:Math.random()};
}

function initGrid(){
  grid=[];
  for(let r=0;r<GRID;r++){grid[r]=[];for(let c=0;c<GRID;c++) grid[r][c]=genTile(r,c);}
  ensureSolvable();
}

// ─── SOLVABILITY ────────────────────────────────
function evalPath(path){
  if(path.length<3) return null;
  let val=Number(path[0].val);
  for(let i=1;i<path.length-1;i+=2){
    const op=path[i].val,n=Number(path[i+1].val);
    if(op==='+') val+=n;
    else if(op==='-') val-=n;
    else if(op==='×') val*=n;
    else if(op==='÷'){if(n===0||!Number.isInteger(val/n))return null;val/=n;}
    else return null;
  }
  return val;
}

function searchFrom(r,c,path,out){
  if(out.length>=20) return;
  if(path.length>=3&&path.length%2===1){
    if(evalPath(path)===target){out.push([...path]);return;}
  }
  if(path.length>=7) return;
  for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){
    const nr=r+dr,nc=c+dc;
    if(nr<0||nr>=GRID||nc<0||nc>=GRID) continue;
    const nb=grid[nr][nc];
    if(nb.type==='wall') continue;
    if(path.some(p=>p.row===nr&&p.col===nc)) continue;
    const last=path[path.length-1];
    if(last.type==='num'&&nb.type!=='op') continue;
    if(last.type==='op'&&nb.type!=='num') continue;
    searchFrom(nr,nc,[...path,nb],out);
  }
}

function collectAllPaths(){
  const found=[];
  for(let r=0;r<GRID&&found.length<20;r++)
    for(let c=0;c<GRID&&found.length<20;c++){
      const t=grid[r][c];
      if(t.type!=='num') continue;
      searchFrom(r,c,[t],found);
    }
  return found;
}

function tryFindPath(){
  for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
    const t=grid[r][c];
    if(t.type!=='num') continue;
    const found=[];
    searchFrom(r,c,[t],found);
    if(found.length) return true;
  }
  return false;
}

function injectSolvable(){
  const op=cfg().ops[rnd(0,cfg().ops.length-1)];
  const r=rnd(0,GRID-1);
  const cStart=rnd(0,GRID-3);
  let a,b;
  if(op==='+'){a=rnd(1,Math.min(target-1,9));b=target-a;}
  else if(op==='-'){a=rnd(target+1,target+9);b=a-target;}
  else if(op==='×'){
    const divs=[];for(let i=1;i<=9;i++)if(target%i===0)divs.push(i);
    if(!divs.length)return;
    a=divs[rnd(0,divs.length-1)];b=target/a;
  }else{
    const m=[];for(let i=1;i<=9;i++)if(Number.isInteger(target*i)&&target*i<=9)m.push(i);
    if(!m.length)return;
    b=m[rnd(0,m.length-1)];a=target*b;
  }
  if(!Number.isInteger(a)||!Number.isInteger(b)||a<1||a>9||b<1||b>9) return;
  grid[r][cStart]  ={type:'num',val:a,row:r,col:cStart,  id:Math.random()};
  grid[r][cStart+1]={type:'op', val:op,row:r,col:cStart+1,id:Math.random()};
  grid[r][cStart+2]={type:'num',val:b,row:r,col:cStart+2,id:Math.random()};
}

function ensureSolvable(){
  for(let i=0;i<300;i++){if(tryFindPath())return;injectSolvable();}
}

function checkAndAutoReset(){
  if(tryFindPath()) return;
  showMsg('🔄 경우의 수 없음 — 보드 새로고침','var(--acc2)');
  soundAutoReset();
  for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
    const el=tileEl(r,c);
    if(el) el.classList.add('auto-reset');
  }
  setTimeout(()=>{
    selected=[];hintPath=null;
    initGrid();
    target=genTarget();
    ensureSolvable();
    updateHUD();
    renderGrid();
  },900);
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function tileEl(r,c){return document.getElementById('grid').children[r*GRID+c];}

function renderGrid(){
  const g=document.getElementById('grid');
  g.innerHTML='';
  const selSet=new Set(selected.map(s=>s.row+','+s.col));
  const hintSet=new Set((hintPath||[]).map(h=>h.row+','+h.col));
  for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
    const t=grid[r][c];
    const div=document.createElement('div');
    div.className='tile '+t.type;
    div.dataset.r=r;div.dataset.c=c;
    if(t.type==='num'){div.dataset.v=t.val;div.textContent=t.val;}
    else if(t.type==='op'){div.dataset.v=t.val;div.textContent=t.val;}
    if(selSet.has(r+','+c))  div.classList.add('selected');
    if(hintSet.has(r+','+c)) div.classList.add('hint');
    div.addEventListener('mousedown',e=>{e.preventDefault();startDrag(r,c);});
    div.addEventListener('mouseover',()=>{if(isDragging)continueDrag(r,c);});
    g.appendChild(div);
  }
  drawTube();
}

function highlightSelected(){
  const selSet=new Set(selected.map(s=>s.row+','+s.col));
  const hintSet=new Set((hintPath||[]).map(h=>h.row+','+h.col));
  for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
    const el=tileEl(r,c);
    if(!el) continue;
    el.classList.toggle('selected',selSet.has(r+','+c));
    el.classList.toggle('hint',hintSet.has(r+','+c));
  }
  drawTube();
}

// ─── TUBE DRAWING — 지렁이 스타일 ────────────────
function getTileCenter(r,c){
  const el=tileEl(r,c);
  const gRect=document.getElementById('grid-container').getBoundingClientRect();
  const eRect=el.getBoundingClientRect();
  return{x:eRect.left-gRect.left+eRect.width/2,y:eRect.top-gRect.top+eRect.height/2,w:eRect.width};
}

function drawTube(){
  const svg=document.getElementById('tube-svg');
  svg.innerHTML='';
  if(!selected.length) return;
  const tubeColor=getComputedStyle(document.body).getPropertyValue('--tube').trim()||'#e94560';
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML='<filter id="tg"><feGaussianBlur stdDeviation="4"/></filter>';
  svg.appendChild(defs);
  try{
    const pts=selected.map(t=>getTileCenter(t.row,t.col));
    const R=pts[0].w*0.44;
    // 연결선
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i],b=pts[i+1];
      const lg=document.createElementNS('http://www.w3.org/2000/svg','line');
      lg.setAttribute('x1',a.x);lg.setAttribute('y1',a.y);lg.setAttribute('x2',b.x);lg.setAttribute('y2',b.y);
      lg.setAttribute('stroke',tubeColor);lg.setAttribute('stroke-width',R*0.9);lg.setAttribute('stroke-linecap','round');lg.setAttribute('stroke-opacity','0.2');lg.setAttribute('filter','url(#tg)');
      svg.appendChild(lg);
      const lm=document.createElementNS('http://www.w3.org/2000/svg','line');
      lm.setAttribute('x1',a.x);lm.setAttribute('y1',a.y);lm.setAttribute('x2',b.x);lm.setAttribute('y2',b.y);
      lm.setAttribute('stroke',tubeColor);lm.setAttribute('stroke-width',R*0.45);lm.setAttribute('stroke-linecap','round');lm.setAttribute('stroke-opacity','0.65');
      svg.appendChild(lm);
    }
    // 순서 뱃지
    pts.forEach((p,i)=>{
      const nr=R*0.46;
      const bc=document.createElementNS('http://www.w3.org/2000/svg','circle');
      bc.setAttribute('cx',p.x);bc.setAttribute('cy',p.y);bc.setAttribute('r',nr);bc.setAttribute('fill','#000');bc.setAttribute('opacity','0.72');
      svg.appendChild(bc);
      const bd=document.createElementNS('http://www.w3.org/2000/svg','circle');
      bd.setAttribute('cx',p.x);bd.setAttribute('cy',p.y);bd.setAttribute('r',nr);bd.setAttribute('fill','none');bd.setAttribute('stroke',tubeColor);bd.setAttribute('stroke-width','2');bd.setAttribute('opacity','0.95');
      svg.appendChild(bd);
      const tx=document.createElementNS('http://www.w3.org/2000/svg','text');
      tx.setAttribute('x',p.x);tx.setAttribute('y',p.y+nr*0.38);tx.setAttribute('text-anchor','middle');tx.setAttribute('font-size',nr*1.1);tx.setAttribute('font-weight','900');tx.setAttribute('font-family','Orbitron,monospace');tx.setAttribute('fill',tubeColor);
      tx.textContent=i+1;
      svg.appendChild(tx);
    });
  }catch(e){}
}

// ═══════════════════════════════════════════════
// DRAG
// ═══════════════════════════════════════════════
function startDrag(r,c){
  if(!gameActive||isPaused) return;
  const t=grid[r][c];
  if(t.type==='wall') return;
  resumeAC();
  isDragging=true;
  selected=[t];
  soundPick();
  updateExpr();
  highlightSelected();
}

function isAdj(a,b){return Math.abs(a.row-b.row)+Math.abs(a.col-b.col)===1;}

function continueDrag(r,c){
  if(!isDragging) return;
  const t=grid[r][c];
  if(t.type==='wall') return;
  if(selected.some(s=>s.row===r&&s.col===c)) return;
  const last=selected[selected.length-1];
  if(!isAdj(last,t)) return;
  if(last.type==='num'&&t.type!=='op') return;
  if(last.type==='op'&&t.type!=='num') return;
  selected.push(t);
  soundConnect();
  updateExpr();
  highlightSelected();
}

function endDrag(){
  if(!isDragging) return;
  isDragging=false;
  if(selected.length>=3&&selected.length%2===1){
    const v=evalPath(selected);
    if(v===target) onSuccess();
    else onFail();
  }else{
    selected=[];highlightSelected();
  }
}

function updateExpr(){
  const txt=document.getElementById('expr-text'),res=document.getElementById('expr-result');
  if(!selected.length){txt.textContent='타일을 드래그하세요...';res.textContent='—';res.style.color='var(--txt3)';return;}
  txt.textContent=selected.map(t=>t.val).join(' ');
  if(selected.length>=3&&selected.length%2===1){
    const v=evalPath(selected);
    if(v===null){res.textContent='?';res.style.color='var(--acc)';}
    else{res.textContent=v;res.style.color=v===target?'var(--acc3)':'var(--acc2)';}
  }else{res.textContent='…';res.style.color='var(--txt3)';}
}

// ═══════════════════════════════════════════════
// SUCCESS / FAIL
// ═══════════════════════════════════════════════
function onSuccess(){
  const pts=selected.length*10*combo;
  score+=pts; combo=Math.min(combo+1,8); hintPath=null;
  soundSuccess(combo);
  screenShake(combo>3?6:3,250);
  selected.forEach(t=>{
    const el=tileEl(t.row,t.col);
    const OP_P={'+':'#4ade80','-':'#f87171','×':'#60a5fa','÷':'#fb923c'};
    spawnParticles(el,t.type==='num'?'#f472b6':(OP_P[t.val]||'#facc15'));
  });
  showMsg(`✓ ${target} 완성! +${pts}점 ×${combo}콤보`,'var(--acc3)');
  const clearing=[...selected];
  clearing.forEach(t=>tileEl(t.row,t.col).classList.add('clear'));
  setTimeout(()=>{
    clearing.forEach(t=>{grid[t.row][t.col]=genTile(t.row,t.col);});
    selected=[];
    target=genTarget();
    ensureSolvable();
    updateHUD();
    renderGrid();
    setTimeout(checkAndAutoReset,200);
  },280);
}

function onFail(){
  selected.forEach(t=>{
    const el=tileEl(t.row,t.col);
    el.classList.add('wrong');
    setTimeout(()=>el.classList.remove('wrong'),420);
  });
  combo=1;
  soundFail();
  screenShake(8,300);
  showMsg('✗ 다시 시도!','var(--acc)');
  selected=[];
  setTimeout(highlightSelected,440);
}

// ─── MANUAL CLEAR WITH PENALTY ─────────────────
function manualClear(){
  if(!gameActive) return;

  // 패널티 먼저
  const c=cfg();
  if(c.penaltyPct>0 && score>0){
    const pen=Math.ceil(score*c.penaltyPct);
    score=Math.max(0,score-pen);
    soundPenalty();
    showPenalty('-'+pen+'점 패널티');
    screenShake(6,250);
  }

  // 보드 전체 초기화
  isDragging=false;
  selected=[];
  hintPath=null;
  initGrid();
  target=genTarget();
  ensureSolvable();
  updateHUD();
  renderGrid();
  showMsg('🔄 보드 초기화!','var(--acc2)');
}

function showPenalty(txt){
  clearTimeout(penaltyTimeout);
  const el=document.getElementById('penalty-badge');
  el.textContent=txt;
  penaltyTimeout=setTimeout(()=>el.textContent='',2500);
}

// ═══════════════════════════════════════════════
// EFFECTS
// ═══════════════════════════════════════════════
function screenShake(intensity=5,duration=300){
  const app=document.getElementById('app');
  const start=performance.now();
  function frame(now){
    const t=(now-start)/duration;
    if(t>=1){app.style.transform='';return;}
    const d=1-t;
    app.style.transform=`translate(${(Math.random()-.5)*intensity*2*d}px,${(Math.random()-.5)*intensity*2*d}px)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function spawnParticles(el,color){
  const rect=el.getBoundingClientRect();
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  for(let i=0;i<10;i++){
    const p=document.createElement('div');
    const angle=(Math.PI*2*i)/10+Math.random()*.5;
    const dist=28+Math.random()*30,size=4+Math.random()*6;
    p.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;width:${size}px;height:${size}px;border-radius:50%;background:${color};pointer-events:none;z-index:999;transform:translate(-50%,-50%);transition:all .45s cubic-bezier(.2,.8,.4,1);opacity:1;`;
    document.body.appendChild(p);
    requestAnimationFrame(()=>{
      p.style.left=(cx+Math.cos(angle)*dist)+'px';
      p.style.top=(cy+Math.sin(angle)*dist)+'px';
      p.style.opacity='0';p.style.transform='translate(-50%,-50%) scale(0.2)';
    });
    setTimeout(()=>p.remove(),500);
  }
}

// ═══════════════════════════════════════════════
// HUD
// ═══════════════════════════════════════════════
function showMsg(txt,color){
  clearTimeout(msgTimeout);
  const el=document.getElementById('message');
  el.textContent=txt;el.style.color=color;
  msgTimeout=setTimeout(()=>el.textContent='',2200);
}

function updateHUD(){
  document.getElementById('score-val').textContent=score;
  document.getElementById('wave-val').textContent=wave;
  document.getElementById('hp-val').textContent=hp==='999'||hp>=999?'∞':hp;
  document.getElementById('combo-val').textContent='×'+combo;
  document.getElementById('target-num').textContent=target;
  best=Math.max(best,score);
  document.getElementById('best-val').textContent=best;
  // hint count
  const hc=document.getElementById('hint-count');
  const hi=document.getElementById('hint-info');
  const btn=document.getElementById('btn-hint');
  if(hintLeft===Infinity){hc.textContent='∞';btn.disabled=false;hi.textContent='';}
  else{hc.textContent=hintLeft;btn.disabled=hintLeft<=0;hi.textContent=hintLeft<=0?'소진됨':'';}
}

// ═══════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════
function startTimer(){
  const wf2=document.getElementById('wave-fill');
  if(wf2) wf2.style.height='100%';
  const c=cfg();
  INFINITE_TIMER=(c.timer===0);
  if(!INFINITE_TIMER) timerDur=Math.max(BASE_DUR-(wave-1)*c.waveDecay,5000);
  else timerDur=Infinity;
  timerStart=performance.now();
  pauseElapsed=0;
  if(rafId) cancelAnimationFrame(rafId);
  tick();
}

function tick(){
  if(!gameActive||isPaused) return;
  const now=performance.now();
  const elapsed=pauseElapsed+(now-timerStart);
  if(INFINITE_TIMER){
    setTimerUI(1,'var(--acc4)','∞');
    rafId=requestAnimationFrame(tick);return;
  }
  const pct=Math.max(0,1-elapsed/timerDur);
  const secs=Math.ceil((timerDur-elapsed)/1000);
  const color=pct>.5?'var(--acc3)':pct>.25?'var(--acc2)':'var(--acc)';
  setTimerUI(pct,color,Math.max(secs,0)+'s');
  const wf=document.getElementById('wave-fill');
  if(wf){wf.style.height=(pct*100)+'%';wf.style.background=color;}
  if(elapsed>=timerDur){pushWave();return;}
  rafId=requestAnimationFrame(tick);
}

function setTimerUI(pct,color,label){
  const bar=document.getElementById('timer-bar');
  bar.style.width=(pct*100)+'%';bar.style.background=color;
  document.getElementById('timer-secs').textContent=label;
}

function pushWave(){
  if(!gameActive) return;
  wave++;hp=Math.max(hp-1,0);combo=Math.max(combo-1,1);hintPath=null;
  if(wave%3===0&&hintLeft!==Infinity) hintLeft=Math.min(hintLeft+1,5);
  soundWave();
  showMsg(`⚠ 웨이브 ${wave}  HP -1`,'var(--acc)');
  shiftUp();addNewRow();
  target=genTarget();ensureSolvable();
  updateHUD();renderGrid();
  if(hp<=0){endGame();return;}
  startTimer();
}

function shiftUp(){
  for(let r=0;r<GRID-1;r++) grid[r]=grid[r+1].map(t=>({...t,row:r}));
}
function addNewRow(){
  const c=cfg();
  const wallCount=Math.min(Math.floor((wave-1)*c.wallPerWave/2),3);
  const cols=Array.from({length:GRID},(_,i)=>i);
  const wallCols=new Set();
  while(wallCols.size<wallCount) wallCols.add(cols[rnd(0,cols.length-1)]);
  grid[GRID-1]=Array.from({length:GRID},(_,c2)=>wallCols.has(c2)?genTile(GRID-1,c2,'wall'):genTile(GRID-1,c2));
}

// ═══════════════════════════════════════════════
// PAUSE / RESUME
// ═══════════════════════════════════════════════
function pauseGame(){
  if(!gameActive||isPaused) return;
  isPaused=true;
  pauseElapsed+=performance.now()-timerStart;
  if(rafId) cancelAnimationFrame(rafId);
  document.getElementById('pause-overlay').classList.add('show');
  const btn=document.getElementById('btn-pause');
  btn.classList.add('paused');btn.textContent='▶ 재개';
}
function resumeGame(){
  if(!isPaused) return;
  isPaused=false;timerStart=performance.now();
  document.getElementById('pause-overlay').classList.remove('show');
  const btn=document.getElementById('btn-pause');
  btn.classList.remove('paused');btn.textContent='⏸ 일시정지';
  tick();
}
function togglePause(){if(!gameActive)return;isPaused?resumeGame():pauseGame();}

// ═══════════════════════════════════════════════
// GAME OVER / RESTART
// ═══════════════════════════════════════════════
function endGame(){
  gameActive=false;
  if(rafId) cancelAnimationFrame(rafId);
  document.getElementById('final-score').textContent=score;
  document.getElementById('final-wave').textContent=wave;
  // show name input modal
  document.getElementById('name-modal-score').textContent=
    `난이도: ${cfg().label}  |  점수: ${score}  |  웨이브: ${wave}`;
  document.getElementById('name-modal').classList.add('show');
}

document.getElementById('btn-name-confirm').addEventListener('click', async ()=>{
  const name=document.getElementById('name-input').value.trim()||'ANONYMOUS';
  const btn=document.getElementById('btn-name-confirm');
  btn.textContent='저장 중...';
  btn.disabled=true;
  await addToLB(currentDiff,name,score,wave);
  btn.textContent='등록하기';
  btn.disabled=false;
  document.getElementById('name-modal').classList.remove('show');
  document.getElementById('gameover').classList.add('show');
});

function restartGame(){
  const c=cfg();
  score=0;hp=c.hp;wave=1;combo=1;selected=[];isDragging=false;
  hintLeft=c.hintN===Infinity?Infinity:c.hintN;hintPath=null;
  isPaused=false;pauseElapsed=0;gameActive=true;
  BASE_DUR=c.timer>0?c.timer*1000:999999999;
  INFINITE_TIMER=(c.timer===0);
  document.getElementById('gameover').classList.remove('show');
  document.getElementById('pause-overlay').classList.remove('show');
  document.getElementById('btn-pause').classList.remove('paused');
  document.getElementById('btn-pause').textContent='⏸ 일시정지';
  document.getElementById('penalty-badge').textContent='';
  document.getElementById('name-input').value='';
  if(c.timer===0){
    document.getElementById('btn-clear-manual').innerHTML='초기화 <span style="color:#34d399;font-size:16px;">∞</span>';
  }else{
    document.getElementById('btn-clear-manual').textContent='초기화';
  }
  target=genTarget();
  initGrid();updateHUD();renderGrid();
  startTimer();
}

// ═══════════════════════════════════════════════
// DIFFICULTY SWITCH
// ═══════════════════════════════════════════════
document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentDiff=btn.dataset.d;
    restartGame();
  });
});

// ═══════════════════════════════════════════════
// TIMER CONTROLS
// ═══════════════════════════════════════════════
// timer controls removed

// ═══════════════════════════════════════════════
// HINT
// ═══════════════════════════════════════════════
document.getElementById('btn-hint').addEventListener('click',()=>{
  if((hintLeft!==Infinity&&hintLeft<=0)||!gameActive) return;
  const paths=collectAllPaths();
  if(!paths.length){showMsg('경로 없음 — 곧 자동 초기화','var(--acc)');return;}
  const pick=paths[Math.floor(Math.random()*paths.length)];
  hintPath=pick;
  if(hintLeft!==Infinity) hintLeft--;
  updateHUD();renderGrid();
  showMsg(`힌트: ${pick.map(t=>t.val).join(' ')} = ${target}`,'var(--acc4)');
  setTimeout(()=>{hintPath=null;renderGrid();},4500);
});

// ═══════════════════════════════════════════════
// LEADERBOARD UI
// ═══════════════════════════════════════════════
let lbCurrentDiff='easy';

async function renderLB(d){
  lbCurrentDiff=d;
  document.querySelectorAll('.lb-tab').forEach(t=>t.classList.toggle('active',t.dataset.d===d));
  const list=document.getElementById('lb-list');
  list.innerHTML='<div class="lb-empty">⏳ 불러오는 중...</div>';

  const arr=await fetchLB(d);

  if(!arr.length){
    list.innerHTML='<div class="lb-empty">아직 기록 없음 👀</div>';
    return;
  }
  list.innerHTML=arr.map((e,i)=>`
    <div class="lb-entry">
      <div class="lb-rank ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
      <div class="lb-name">${e.name}</div>
      <div class="lb-score">${Number(e.score).toLocaleString()}</div>
      <div class="lb-wave">W${e.wave}</div>
    </div>`).join('');
}

function openLB(){
  const overlay=document.getElementById('lb-overlay');
  const tabs=document.getElementById('lb-tabs');
  tabs.innerHTML=Object.entries(DIFF).map(([k,v])=>
    `<button class="lb-tab${k===lbCurrentDiff?' active':''}" data-d="${k}">${v.label.split(' ')[1]||v.label}</button>`
  ).join('');
  tabs.querySelectorAll('.lb-tab').forEach(t=>t.addEventListener('click',()=>renderLB(t.dataset.d)));
  renderLB(currentDiff);
  overlay.classList.add('show');
}

  document.getElementById('name-modal').classList.add('show');
});
document.getElementById('btn-lb-close').addEventListener('click',()=>document.getElementById('lb-overlay').classList.remove('show'));
